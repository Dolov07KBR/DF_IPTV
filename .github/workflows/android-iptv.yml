name: Build DF IPTV_07 APK
on:
  push:
    branches: [main, 'arena/**']
    paths: ['android/**', '.github/workflows/android-iptv.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android-iptv.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle.kts
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/build.log
      - name: Post build log tail on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '```'
            grep -E "e: |error:|FAILURE|Caused by|What went wrong" -A 3 /tmp/build.log | head -120
            echo '```'
          } > /tmp/tail.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="❌ Build log tail:
          $(cat /tmp/tail.md)" || true
      - uses: actions/upload-artifact@v4
        with:
          name: DF-IPTV-07-debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
